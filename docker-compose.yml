version: '3.8'

services:
  # Serviço principal do Nex Chat
  nex-chat:
    build: .
    container_name: nex-chat
    ports:
      - "8000:8000"
    volumes:
      # Persistência de dados
      - nex-data:/app/data
      # Cache de modelos (opcional)
      - model-cache:/root/.cache
      # Para modelos GGUF locais
      - ./models:/app/models:ro
    environment:
      - MODEL_NAME=${MODEL_NAME:-gemma2:2b}
      - OLLAMA_HOST=http://ollama:11434
      - PYTHONUNBUFFERED=1
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - nex-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Serviço Ollama dedicado (opcional)
  ollama:
    image: ollama/ollama:latest
    container_name: nex-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    networks:
      - nex-network
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

  # Interface de monitoramento (opcional)
  nex-monitor:
    image: nginx:alpine
    container_name: nex-monitor
    ports:
      - "8080:80"
    volumes:
      - ./monitor:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - nex-network
    profiles:
      - monitoring

networks:
  nex-network:
    driver: bridge

volumes:
  nex-data:
    driver: local
  ollama-models:
    driver: local
  model-cache:
    driver: local
