<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nex — Assistente de IA local com memória persistente.">
    <title>Nex</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-mark">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                            <path d="M12 2L2 7l10 5 10-5-10-5z" fill="currentColor" opacity="0.9"/>
                            <path d="M2 17l10 5 10-5" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.6"/>
                            <path d="M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.8"/>
                        </svg>
                    </div>
                    <span class="logo-name">Nex</span>
                </div>
                <button class="icon-btn sidebar-toggle" id="sidebarToggle" title="Fechar menu">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
            </div>

            <div class="sidebar-body">
                <button id="newSessionBtn" class="new-chat-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    <span>Nova conversa</span>
                </button>

                <div class="section-label">Recentes</div>
                <div id="sessionsList" class="sessions-list"></div>
            </div>

            <div class="sidebar-footer">
                <div class="system-status" id="statsPanel">
                    <div class="status-row">
                        <span class="status-dot" id="statusDot"></span>
                        <span class="status-label">Modelo</span>
                        <span class="status-val" id="statBackend">—</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">Memórias</span>
                        <span class="status-val" id="statSessions">0</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">Status</span>
                        <span class="status-val" id="statUptime">—</span>
                    </div>
                </div>
                <button id="clearCacheBtn" class="danger-btn">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
                    Limpar cache
                </button>
            </div>
        </aside>

        <!-- Main -->
        <main class="chat-main" id="chatMain">
            <header class="chat-header">
                <button class="icon-btn menu-btn" id="menuBtn" title="Menu">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="8" x2="21" y2="8"/><line x1="3" y1="16" x2="21" y2="16"/></svg>
                </button>

                <div class="header-center">
                    <span class="chat-title-text" id="chatTitle">Nova conversa</span>
                    <div class="header-badges">
                        <span class="pill pill-model" id="badgeModel">—</span>
                        <span class="pill pill-local">Local</span>
                        <span class="pill pill-private">Privado</span>
                    </div>
                </div>

                <button class="icon-btn reset-btn" id="resetBtn" title="Limpar conversa">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.96"/></svg>
                </button>
            </header>

            <div id="chatMessages" class="chat-messages">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                            <path d="M12 2L2 7l10 5 10-5-10-5z" fill="currentColor"/>
                            <path d="M2 17l10 5 10-5" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.5"/>
                            <path d="M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.75"/>
                        </svg>
                    </div>
                    <h2 class="welcome-title">Como posso ajudar?</h2>
                    <p class="welcome-sub">IA rodando localmente · memória de longo prazo ativa</p>
                    <div class="suggestions" id="suggestionsContainer">
                        <button class="suggestion-chip" data-text="Olá! Quem é você e o que você pode fazer?">Quem é você?</button>
                        <button class="suggestion-chip" data-text="Me explique como funciona sua memória persistente.">Como é sua memória?</button>
                        <button class="suggestion-chip" data-text="Escreva um poema curto sobre inteligência artificial local.">Escreva um poema</button>
                        <button class="suggestion-chip" data-text="Me dê um resumo das nossas últimas conversas.">Últimas conversas</button>
                    </div>
                </div>
            </div>

            <div class="input-zone">
                <div class="input-toolbar">
                    <button id="uploadBtn" class="toolbar-btn" title="Anexar arquivo">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    </button>
                    <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md,.json,.csv" style="display:none">
                    <div class="toolbar-separator"></div>
                    <label class="toggle-option" title="Buscar informacoes na web">
                        <input type="checkbox" id="webSearchToggle" checked>
                        <span class="toggle-label">🌐 Web</span>
                    </label>
                    <label class="toggle-option" title="Usar memoria de longo prazo">
                        <input type="checkbox" id="memoryToggle" checked>
                        <span class="toggle-label">🧠 Memoria</span>
                    </label>
                </div>
                <div class="input-shell" id="inputShell">
                    <textarea
                        id="messageInput"
                        class="message-input"
                        placeholder="Mensagem…"
                        rows="1"
                        maxlength="4000"
                        autocomplete="off"
                    ></textarea>
                    <div class="input-controls">
                        <span class="char-counter" id="charCount"></span>
                        <button id="sendBtn" class="send-btn" title="Enviar" disabled>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <p class="input-hint">Suas conversas ficam apenas no seu computador</p>
            </div>
        </main>
    </div>

    <div class="toast" id="notification"></div>

    <script src="/static/script.js"></script>
</body>
</html>
